# 入口を 1 つにまとめるリバースプロキシ
#   /          … 統計ダッシュボード（gatekeeper）
#   /frigate/  … Frigate UI（認証あり。内部の 8971 へ）
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location / {
        proxy_pass http://gatekeeper:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # 末尾スラッシュなしでアクセスされたら /frigate/ へ
    location = /frigate {
        return 301 /frigate/;
    }

    location /frigate/ {
        proxy_pass https://frigate:8971/;
        proxy_ssl_verify off;               # Frigate の自己署名証明書
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path /frigate;   # Frigate がサブパス用にリンクを書き換える
        proxy_set_header Upgrade $http_upgrade;     # ライブ映像の WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
