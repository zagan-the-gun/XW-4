name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gatekeeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gatekeeper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frigate 設定と compose の構文チェック
        run: |
          pip install pyyaml
          python -c "import yaml; [yaml.safe_load(open(f)) for f in ('config/config.yml','config/config.mac.yml')]"
          cp .env.example .env
          docker compose config -q
